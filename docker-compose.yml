version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: study_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-study_db}
      POSTGRES_USER: ${POSTGRES_USER:-study_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-study_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-study_user} -d ${POSTGRES_DB:-study_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: study_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: study_web
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --worker-class gthread --timeout 120
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-study_user}:${POSTGRES_PASSWORD:-study_secure_password_2026}@db:5432/${POSTGRES_DB:-study_db}
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: study_celery
    restart: always
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-study_user}:${POSTGRES_PASSWORD:-study_secure_password_2026}@db:5432/${POSTGRES_DB:-study_db}
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: study_nginx
    restart: always
    ports:
      - "${STUDY_PORT:-8001}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/staticfiles:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_volume:
  certs_volume:
